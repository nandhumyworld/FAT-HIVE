server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;

    # Long cache for static assets (filenames are stable in this package)
    location ~* \.(?:css|js|svg|png|jpe?g|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Serve files; the hub is client-side routed, so fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Light security headers (safe for a static site)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
